# ========================================================
# Spring Boot アプリケーション設定ファイル（application.properties）
# アプリを起動するときの基本設定を定義します
# ========================================================

# サーバー設定
server.port=8080  # バックエンドが起動するポート（localhost:8080）

# アプリケーション情報
spring.application.name=nyan-app-backend  # このアプリケーションの名前

# ========== データベース設定 ==========
# H2 データベース（インメモリデータベース）を使用
spring.datasource.url=jdbc:h2:mem:testdb  # データベースの接続先（メモリ内の "testdb" という名前のDB）
spring.datasource.driverClassName=org.h2.Driver  # H2 ドライバーを使用
spring.datasource.username=sa  # ユーザー名（sa = System Administrator の略）
spring.datasource.password=  # パスワード（空でOK）

# ========== JPA/Hibernate 設定 ==========
# ORM（Object-Relational Mapping）を使ってオブジェクトとデータベースを連携させる
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect  # H2 に対応した SQL 方言を使用
spring.jpa.hibernate.ddl-auto=create-drop  # アプリ起動時にテーブルを自動作成、終了時に削除
spring.jpa.show-sql=true  # 実行される SQL をコンソールに表示（デバッグ用）
spring.jpa.properties.hibernate.format_sql=true  # SQL を見やすくフォーマット

# ========== H2 コンソール設定 ==========
# H2 データベースをブラウザで操作できるコンソールを有効化
spring.h2.console.enabled=true  # H2 コンソールを有効にする
spring.h2.console.path=/h2-console  # H2 コンソールへのアクセスパス
# ブラウザで http://localhost:8080/h2-console にアクセスするとデータベースを確認できる
